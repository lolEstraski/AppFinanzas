services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finanzas}
      POSTGRES_USER: ${DB_USERNAME:-finanzas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finanzas_pass}
    ports:
      - "5432:5432"
    volumes:
      - finanzas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finanzas_user} -d ${DB_NAME:-finanzas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: finanzas-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  finanzas_pg_data:
