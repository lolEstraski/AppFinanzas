spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finanzas
    username: ${DB_USERNAME:finanzas_user}
    password: ${DB_PASSWORD:finanzas_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-32-bytes-minimum}
  cors:
    allowed-origin-patterns: "*"
  mail:
    sender: console

logging:
  level:
    com.finanzas.app: DEBUG
